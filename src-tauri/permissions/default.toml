[[permission]]
identifier = "allow-orbit-commands"
description = "Allows the frontend to manage torrents, inspect files and peers, set transfer limits, and control the tray."
commands.allow = [
  "list_torrents",
  "default_download_folder",
  "legacy_default_download_folder",
  "add_magnet",
  "add_torrent_file",
  "pause_torrent",
  "resume_torrent",
  "remove_torrent",
  "remove_torrent_and_files",
  "open_torrent_folder",
  "open_download_folder",
  "torrent_files",
  "set_torrent_files",
  "torrent_peers",
  "get_rate_limits",
  "set_rate_limits",
  "set_close_to_tray",
  "take_pending_torrent_files"
]
