[[permission]]
identifier = "allow-orbit-commands"
description = "Allows the frontend to manage torrents and read the default download folder."
commands.allow = [
  "list_torrents",
  "default_download_folder",
  "add_magnet",
  "add_torrent_file",
  "pause_torrent",
  "resume_torrent",
  "remove_torrent"
]
